<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="heroShoeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow Shadow -->
  <ellipse cx="300" cy="300" rx="220" ry="25" fill="#00F0FF" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Shoe Upper Body -->
  <path d="M 80,240 C 90,210 130,160 200,140 C 260,120 340,90 410,130 C 470,165 520,200 520,250 C 480,260 400,260 300,260 C 200,260 120,260 80,240 Z" fill="url(#heroShoeGrad)"/>
  
  <!-- Collar & Tongue -->
  <path d="M 210,140 C 240,100 290,80 340,95 C 380,105 400,125 410,130 C 350,110 270,125 210,140 Z" fill="#13171F"/>
  <path d="M 280,90 C 310,70 350,75 365,95 C 330,85 295,85 280,90 Z" fill="#CCFF00"/>
  
  <!-- Lacing Lines -->
  <line x1="280" y1="125" x2="310" y2="105" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="300" y1="135" x2="330" y2="115" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="320" y1="145" x2="350" y2="125" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="340" y1="155" x2="370" y2="135" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Swoosh / Accent Wave -->
  <path d="M 140,210 C 220,235 340,200 460,170 C 360,230 220,245 140,210 Z" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Thick Cushion Sole -->
  <path d="M 60,250 C 120,250 200,260 300,260 C 400,260 480,260 540,250 C 550,275 520,290 470,290 C 350,295 180,295 70,285 C 55,275 50,260 60,250 Z" fill="url(#soleGrad)"/>
  
  <!-- Sole Tread Details -->
  <path d="M 80,285 L 120,285 L 110,292 L 70,288 Z" fill="#00F0FF"/>
  <path d="M 160,288 L 220,288 L 210,294 L 150,293 Z" fill="#7000FF"/>
  <path d="M 270,290 L 350,290 L 340,295 L 260,295 Z" fill="#CCFF00"/>
  <path d="M 400,290 L 480,286 L 470,292 L 390,294 Z" fill="#00F0FF"/>
</svg>
