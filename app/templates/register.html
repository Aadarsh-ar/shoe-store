{% extends "base.html" %}

{% block title %}Create Account - ShoeStore{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; padding-top: 60px; padding-bottom: 100px;">

  <div style="background: #fafafa; border: 1px solid var(--border-color); padding: 40px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <h1 style="font-size: 24px; color: var(--text-primary);">JOIN SHOESTORE CLUB</h1>
      <p style="color: var(--text-secondary); font-size: 13px; margin-top: 6px;">Create an account for drop alerts and express order tracking.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label">FULL NAME</label>
        <input type="text" name="full_name" class="form-control" placeholder="Alex Morgan" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">EMAIL ADDRESS</label>
        <input type="email" name="email" class="form-control" placeholder="alex@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">PASSWORD</label>
        <input type="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
      </div>

      <div class="form-group">
        <label class="form-label">CONFIRM PASSWORD</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 10px;">CREATE ACCOUNT</button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--text-primary); font-weight: 700; text-decoration: underline;">Sign In</a>
    </div>
  </div>

</div>
{% endblock %}
